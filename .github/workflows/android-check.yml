name: android-check

# Runs the Android app on an emulator against the real Windows program (built for Linux),
# and publishes screenshots + logs to the "checks" branch so the UI can be reviewed.
on:
  push:
    branches-ignore: [builds, checks]
    paths: ["android/**", "windows/**", ".github/workflows/android-check.yml", ".github/scripts/**"]
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the emulator needs several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift /usr/local/julia* || true
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: windows/go.mod
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Build laptop program (Linux build of the Windows app)
        working-directory: windows
        run: go build -o ../bin/lanshare ./cmd/lanshare
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disk-size: 3000M
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator-check.sh
      - name: Publish screenshots to the checks branch
        if: always()
        run: |
          mkdir -p check-out && cd check-out
          printf 'branch: %s\ncommit: %s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > RUN.txt
          git init -q -b checks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Checks from $GITHUB_REF_NAME @ ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" checks
