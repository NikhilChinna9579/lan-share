name: build

# Runs on every push and pull request. Download the .exe and the APK from the
# run's "Artifacts" section on GitHub (Actions tab → pick the run → scroll down).
on:
  push:
    branches-ignore: [builds, checks]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows app (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: windows/go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build phone simulator (for testing)
        run: go build ./cmd/fakephone
      - name: Build lanshare.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        # -s -w strips debug info: a smaller .exe.
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o lanshare.exe ./cmd/lanshare
      - uses: actions/upload-artifact@v4
        with:
          name: lanshare-windows
          path: windows/lanshare.exe

  android:
    name: Android app (Kotlin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lanshare-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # Puts the latest .exe and APK on the "builds" branch, replacing the previous ones,
  # so they can be downloaded straight from GitHub's file view without unzipping.
  publish:
    name: Publish latest builds
    needs: [windows, android]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Force-push to the builds branch
        run: |
          mkdir site && cd site
          cp ../out/lanshare-windows/lanshare.exe .
          cp ../out/lanshare-android/app-debug.apk lanshare.apk
          printf 'branch: %s\ncommit: %s\nbuilt: %s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > BUILD.txt
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Builds from $GITHUB_REF_NAME @ ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds
